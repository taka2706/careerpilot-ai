services:
  - type: web
    name: careerpilot-ai-api-taka2706
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////tmp/careerpilot.db
      - key: RAG_STORAGE_PATH
        value: /tmp/careerpilot-rag
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: careerpilot-ai-web-taka2706
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run frontend/Home.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: CAREERPILOT_API_URL
        fromService:
          type: web
          name: careerpilot-ai-api-taka2706
          property: hostport
